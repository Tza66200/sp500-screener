# Sociétés passées sous une nouvelle entité déclarante à la SEC (nouveau CIK) qui reprend la
# cotation, par exemple après un changement d'État de constitution : les comptes antérieurs
# restent publiés sous l'ancien CIK. Les deux historiques sont réunis pour calculer les mesures
# (les comptes de l'ancienne entité, puis ceux de la nouvelle) et les dates de publication de
# résultats. Format : nouveau CIK: [ancien CIK, ...]
