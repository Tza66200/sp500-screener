# Protocole de validation pré-enregistré.
# Rédigé le 16/10/2026, AVANT toute exécution sur données réelles.
# Règle : on ne modifie ni les variantes, ni les critères, ni les périodes après
# avoir vu des résultats. La période réservée reste masquée (revealed: false)
# tant que le modèle n'est pas figé ; on ne la révèle qu'une seule fois.

frozen_on: "2026-10-16"

design_period:
  start: "2011-03-01"
  end: "2020-12-31"

subperiods:
  - ["2011-03-01", "2015-12-31"]
  - ["2016-01-01", "2020-12-31"]

holdout:
  start: "2021-01-01"
  # Révélée le 17/10/2026 à 12 h 55, une seule fois, avec V1, V2 et V3 figées.
  # Ne plus modifier ces trois modèles en fonction de ce qui apparaît.
  revealed: true

# Modèles évalués (pondérations dans settings.yaml). V1 figée le 16/10/2026 avant tout
# test ; V2 enregistrée le 16/10/2026 à 13 h 15 après lecture des résultats de V1 sur
# 2011-2020 : ses résultats sur cette période ne valent pas validation. V3 (« gain avec
# risque maîtrisé ») enregistrée le 17/10/2026 à 8 h 46, avant la révélation de la période
# réservée, après lecture des résultats de V1 et V2 : même réserve que pour V2.
# Avec trois modèles jugés sur la même période réservée, il devient plus probable que l'un
# d'eux y paraisse bon par hasard : on regardera les trois ensemble, sans retenir le
# meilleur après coup.
models: [v1, v2, v3]

# Variantes comparées à la référence de chaque modèle (au plus trois)
# "equal" = poids égaux entre les facteurs utilisés par le modèle
variants:
  reference: {}
  equal_weights:
    weights: equal
  trend_filter:
    trend_filter: true
  fixed_12m:
    holding: fixed_12m

# Tests de robustesse appliqués à la référence de chaque modèle
robustness:
  review_shift_1m:
    review_months: [4, 6, 9, 12]
  positions_15:
    n_positions: 15
  positions_30:
    n_positions: 30
  weights_a:
    weights:
      v1: {growth: 0.30, momentum: 0.25, quality: 0.20, value: 0.10, risk: 0.15}
      v2: {earnings: 0.25, momentum: 0.30, quality: 0.25, value: 0.10, risk: 0.10}
      v3: {earnings: 0.20, momentum: 0.30, quality: 0.20, value: 0.15, risk: 0.15}
  weights_b:
    weights:
      v1: {growth: 0.20, momentum: 0.25, quality: 0.25, value: 0.15, risk: 0.15}
      v2: {earnings: 0.20, momentum: 0.35, quality: 0.20, value: 0.15, risk: 0.10}
      v3: {earnings: 0.20, momentum: 0.20, quality: 0.25, value: 0.15, risk: 0.20}

ic_horizons_months: [1, 3, 6, 12, 18]
success_horizons_months: [12, 18]
success_top_n: 20

# Critères de réussite fixés d'avance
criteria:
  excess_vs_equal_weight_each_subperiod: >
    Surperformance annualisée nette de frais de la référence face au S&P 500
    équipondéré, positive sur chacune des deux sous-périodes.
  factor_ic_12m_positive: >
    Corrélation de rang moyenne à 12 mois positive pour chaque facteur conservé.
  robustness_same_sign: >
    Surperformance nette face à l'équipondéré de même signe que la référence
    pour au moins 4 des 5 tests de robustesse.
  # Ajouté le 16/10/2026 à 13 h 15 (après lecture des résultats de V1 sur 2011-2020)
  top20_beats_base_rate_12m: >
    Les 20 premiers titres battent la moyenne équipondérée de l'univers éligible à
    12 mois plus souvent que le taux de base (part des titres de l'univers qui la battent).
